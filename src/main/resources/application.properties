
spring.application.name=consolehub

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5431/consolehub
spring.datasource.username=consolehub
spring.datasource.password=consolehub_dev

# Hibernate - Flyway owns the schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5671
spring.rabbitmq.username=consolehub
spring.rabbitmq.password=consolehub_dev

# Actuator
management.endpoints.web.exposure.include=health,info

